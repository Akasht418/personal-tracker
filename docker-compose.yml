services:
  # Service 1: MySQL Database Container
  db:
    image: mysql:8.0
    container_name: mysql-tracker
    restart: always
    environment:
      MYSQL_DATABASE: personal_tracker
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # Service 2: Spring Boot Application Container
  app:
    build: .
    container_name: springboot-tracker
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/personal_tracker?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db

volumes:
  mysql-data: